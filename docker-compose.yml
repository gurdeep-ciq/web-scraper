services:
  postgres:
    image: postgres:16
    container_name: totalwine_pg
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: totalwine
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d totalwine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
