[project]
name = "totalwine-scraper"
version = "0.1.0"
description = "POC scraper for totalwine.com product/pricing/review data (Bright Data replacement)"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "patchright>=1.47",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[project.scripts]
scraper = "scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]
